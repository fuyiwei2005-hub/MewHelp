[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-support-ch01"
version = "0.1.0"
description = "Streaming ecommerce support with FastAPI and LangChain"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.147.0", "langchain-openai==1.7.2", "langchain-core==1.6.12",
  "pydantic-settings==2.16.0", "uvicorn>=0.30,<1", "httpx==0.28.1", "sqlalchemy[asyncio]==2.0.55", "asyncmy==0.2.16", "cryptography==50.0.2", "APScheduler==3.11.3", "FlagEmbedding==1.4.2", "pymilvus==3.0.2"
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
app = ["web/*.html"]

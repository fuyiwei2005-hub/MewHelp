<script>
(function(){
"use strict";
const $ = function(id){return document.getElementById(id);};
const input=$("message-input"), send=$("send"), messages=$("messages"), scroll=$("chat-scroll");
let conversationId=null, busy=false, controller=null, serverDone=false, followBottom=true;
const reducedMotion=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const assistantIcon='<svg viewBox="0 0 24 24"><path d="M4 13v-2a8 8 0 0116 0v2M4 11H3v6h3v-6zm16 0h1v6h-3v-6zM18 17v2h-6"/></svg>';
const userIcon='<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M6 20v-2a6 6 0 0112 0v2"/></svg>';
scroll.addEventListener("scroll",function(){followBottom=scroll.scrollHeight-scroll.scrollTop-scroll.clientHeight<90;});
function bottom(){if(followBottom)scroll.scrollTop=scroll.scrollHeight;}
window.addEventListener("resize",function(){followBottom=true;bottom();});
function resize(){input.style.height="auto";input.style.height=Math.min(input.scrollHeight,120)+"px";}
input.addEventListener("input",function(){resize();if(!busy)send.disabled=!input.value.trim();});
function setBusy(value){
 busy=value; $("new-chat").disabled=value;$("mobile-new").disabled=value;
 send.classList.toggle("stop",value);$("send-label").textContent=value?"停止":"发送";
 $("send-icon").innerHTML=value?'<rect x="7" y="7" width="10" height="10" rx="1"/>':'<path d="M12 19V5M6 11l6-6 6 6"/>';
 send.disabled=value?serverDone:!input.value.trim();
}
function addMessage(role,text){
 const row=document.createElement("div");row.className="message "+role;
 const avatar=document.createElement("div");avatar.className="message-avatar";avatar.innerHTML=role==="user"?userIcon:assistantIcon;
 const body=document.createElement("div");body.className="message-body";
 const meta=document.createElement("div");meta.className="message-meta";
 const name=document.createElement("span");name.textContent=role==="user"?"您":"青禾客服";
 const time=document.createElement("span");time.textContent=new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"});
 meta.append(name,time);
 const bubble=document.createElement("div");bubble.className="bubble";bubble.textContent=text;
 body.append(meta,bubble);row.append(avatar,body);messages.append(row);bottom();
 return {row:row,body:body,bubble:bubble};
}
function formatCompleted(bubble){
 const text=bubble.textContent,pattern=/\*\*([^*\n]+)\*\*/g;
 const fragment=document.createDocumentFragment();let match,index=0;
 while((match=pattern.exec(text))!==null){
  fragment.append(document.createTextNode(text.slice(index,match.index)));
  const strong=document.createElement("strong");strong.textContent=match[1];fragment.append(strong);
  index=match.index+match[0].length;
 }
 fragment.append(document.createTextNode(text.slice(index)));bubble.replaceChildren(fragment);
}
function addNote(view,text){const note=document.createElement("div");note.className="message-note";note.textContent=text;view.body.append(note);bottom();}
function painter(bubble){
 let queue="",frame=null,last=performance.now(),finishResolve=null,finished=false;
 function tick(now){
  const count=reducedMotion?queue.length:Math.min(8,Math.floor((now-last)/16));
  if(count>0&&queue){bubble.textContent+=queue.slice(0,count);queue=queue.slice(count);last=now;bottom();}
  if(queue){frame=requestAnimationFrame(tick);}
  else{frame=null;if(finished&&finishResolve)finishResolve();}
 }
 return {
  push:function(text){queue+=text;if(frame===null){last=performance.now()-16;frame=requestAnimationFrame(tick);}},
  finish:function(){finished=true;return new Promise(function(resolve){finishResolve=resolve;if(!queue)resolve();});},
  flush:function(){if(frame!==null)cancelAnimationFrame(frame);frame=null;bubble.textContent+=queue;queue="";if(finishResolve)finishResolve();bottom();}
 };
}
function newChat(){
 if(busy)return;
 conversationId=null;messages.replaceChildren();$("welcome").hidden=false;
 $("conversation-title").textContent="有什么可以帮您？";$("session-label").textContent="新的开始";
 $("status").textContent="很高兴为您服务";input.value="";resize();setBusy(false);followBottom=true;input.focus();
}
$("new-chat").addEventListener("click",newChat);$("mobile-new").addEventListener("click",newChat);
document.querySelectorAll("[data-question]").forEach(function(button){button.addEventListener("click",function(){input.value=button.dataset.question;submit();});});
input.addEventListener("keydown",function(event){if(event.key==="Enter"&&!event.shiftKey&&!event.isComposing){event.preventDefault();if(!busy)submit();}});
$("chat-form").addEventListener("submit",function(event){
 event.preventDefault();
 if(busy){if(controller&&!serverDone)controller.abort();return;}
 submit();
});
async function submit(){
 const text=input.value.trim();if(!text||busy)return;
 const isFirst=!conversationId;
 $("welcome").hidden=true;
 if(!messages.children.length){const date=document.createElement("div");date.className="date-divider";date.textContent="今天 · "+new Date().toLocaleDateString("zh-CN",{month:"long",day:"numeric"});messages.append(date);}
 followBottom=true;addMessage("user",text);
 if(isFirst)$("conversation-title").textContent=text;
 input.value="";resize();serverDone=false;setBusy(true);
 const view=addMessage("assistant","");view.bubble.classList.add("typing");
 const paint=painter(view.bubble);controller=new AbortController();let reader=null,receivedDone=false;
 $("status").textContent="正在认真读您的问题…";
 function consume(block){
  let name="message";const data=[];
  block.split("\n").forEach(function(line){if(line.startsWith("event:"))name=line.slice(6).trim();else if(line.startsWith("data:"))data.push(line.slice(5).trimStart());});
  if(!data.length)return;
  const payload=JSON.parse(data.join("\n"));
  if(name==="meta"){conversationId=payload.conversation_id;$("session-label").textContent="本次对话已连接";}
  if(name==="status"){$("status").textContent=payload.message;}
  if(name==="tool_start"){
   view.row.classList.add("has-tools");
   if(!view.trail){view.trail=document.createElement("div");view.trail.className="tool-trail";view.body.insertBefore(view.trail,view.bubble);view.badges={};}
   const badge=document.createElement("span");badge.className="tool-badge";badge.dataset.state="running";
   badge.dataset.label=payload.label||payload.name;badge.dataset.demo=payload.demo?" · 演示数据":"";
   badge.textContent=badge.dataset.label+badge.dataset.demo+" · 查询中";
   view.badges[payload.tool_call_id]=badge;view.trail.append(badge);
   $("status").textContent="正在"+(payload.label||"查询")+"…";bottom();
  }
  if(name==="tool_retry"){$("status").textContent="正在重试查询，第"+payload.attempt+"次…";}
  if(name==="tool_end"&&view.badges){
   const badge=view.badges[payload.tool_call_id];
   if(badge){badge.dataset.state=payload.status;badge.textContent=badge.dataset.label+badge.dataset.demo+" · "+({completed:"已完成",not_found:"未命中",failed:"暂不可用"}[payload.status]||payload.status);}
   bottom();
  }
  if(name==="token"){if(typeof payload.text!=="string")throw new Error("回复格式异常，请稍后重试。");paint.push(payload.text);$("status").textContent="正在回复您…";}
  if(name==="done"){receivedDone=payload.finish_reason==="stop";if(receivedDone){serverDone=true;setBusy(true);}}
  if(name==="error")throw new Error(payload.message||"回复中断了，请重新发送。");
 }
 try{
  const response=await fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json","Accept":"text/event-stream"},body:JSON.stringify({message:text,conversation_id:conversationId}),signal:controller.signal});
  if(!response.ok){
   let detail=null;try{detail=(await response.json()).detail;}catch(_){}
   if(response.status===404){conversationId=null;$("session-label").textContent="会话已过期";throw new Error("上次会话已过期。请开启新对话，或重新发送并补充相关信息。");}
   const description=typeof detail==="string"?detail:(detail&&typeof detail.message==="string"?detail.message:null);
   throw new Error(description||"暂时无法发送，请稍后重试。");
  }
  if(!response.body)throw new Error("浏览器不支持流式读取，请换用新版浏览器。");
  reader=response.body.getReader();const decoder=new TextDecoder("utf-8");let buffer="";
  while(true){
   const chunk=await reader.read();
   buffer+=chunk.done?decoder.decode():decoder.decode(chunk.value,{stream:true});
   buffer=buffer.replace(/\r\n/g,"\n");
   let boundary;
   while((boundary=buffer.indexOf("\n\n"))!==-1){consume(buffer.slice(0,boundary));buffer=buffer.slice(boundary+2);}
   if(chunk.done)break;
  }
  if(buffer.trim())consume(buffer);
  if(!receivedDone)throw new Error("连接中断了，本轮未完成，请重新发送。");
  serverDone=true;setBusy(true);$("status").textContent="正在显示完整回复…";
  await paint.finish();view.bubble.classList.remove("typing");formatCompleted(view.bubble);bottom();
  $("status").textContent="我在这里，您可以继续说";
 }catch(error){
  if(controller)controller.abort();
  paint.flush();view.bubble.classList.remove("typing");view.row.classList.add("error");
  if(!view.bubble.textContent)view.bubble.textContent=error.name==="AbortError"?"已停止本次回复。":"这次没有完成回复。";
  addNote(view,error.name==="AbortError"?"已停止，本轮不会加入对话上下文。":error.message+" 本轮未加入对话上下文。");
  $("status").textContent=error.name==="AbortError"?"已停止，随时可以重新发送":"发送未完成，请重试";
  if(!input.value)input.value=text;resize();
 }finally{
  if(reader){try{reader.releaseLock();}catch(_){}}
  controller=null;setBusy(false);input.focus();bottom();
 }
}
})();
</script>
</body>
</html>
